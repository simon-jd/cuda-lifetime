# Python tool tests: the driver, runner, translator, evaluator and scripts.
# They use fake native executables and synthetic compiler databases, so they
# need neither LLVM nor CUDA. The native checker and its lit fixtures need the
# LLVM/Clang 23.1.3 development tree, which this workflow does not build; run
# them with CTest locally or in docker/Dockerfile.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} tool tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Byte-compile every Python file
        run: python -m compileall -q tool translate eval scripts tests probes
